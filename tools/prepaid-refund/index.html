<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>店关门了，卡里的钱能退多少 · 预付卡退款计算器</title>
<meta name="description" content="健身房、理发店、洗车店的充值卡，店关门了能退多少？填卡里余额、实际付了多少、送了多少，马上算出来。仅供参考，不构成法律意见。">
<meta name="theme-color" content="#F2F4F5">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <div class="top"><h1 data-t="h1"></h1><button class="lang" id="lang" type="button"></button></div>
  <p class="lead" data-t="lead"></p>
  <div class="card">
    <label class="fl" for="bal"><span data-t="balL"></span> <small data-t="balS"></small></label>
    <div class="money"><span>¥</span><input id="bal" type="number" inputmode="decimal" min="0" placeholder="2566"></div>
    <label class="fl" for="paid"><span data-t="paidL"></span> <small data-t="paidS"></small></label>
    <div class="money"><span>¥</span><input id="paid" type="number" inputmode="decimal" min="0" placeholder="2000"></div>
    <label class="fl" for="gift"><span data-t="giftL"></span> <small data-t="giftS"></small></label>
    <div class="money"><span>¥</span><input id="gift" type="number" inputmode="decimal" min="0" placeholder="1000"></div>
    <div class="err" id="err"></div>
    <button class="ex" id="ex" type="button" data-t="ex"></button>
  </div>
  <section class="hero idle" id="hero" aria-live="polite">
    <div class="lbl" data-t="resL"></div>
    <div class="big" id="big">—</div>
    <div class="small" id="how"></div>
  </section>
  <div class="note" data-t="note"></div>
  <p class="foot"><span data-t="foot"></span> <a href="full.html" data-t="more"></a></p>
</main>
<script src="core.js"></script>
<script>
(function(){
var T={zh:{h1:'店关门了，卡里的钱能退多少？',lang:'English',lead:'预付卡就是先充钱、以后慢慢用的卡，比如健身房、理发店、洗车店的充值卡。店关门或跑路了，没用完的钱可以要回来，但店里送的钱不退。',
 balL:'卡里还剩多少',balS:'卡上显示的余额',paidL:'当初实际付了多少',paidS:'自己掏的钱',giftL:'店里送了多少',giftS:'没送就填 0',ex:'填入示例：充 2000 送 1000，还剩 2566',
 resL:'大约能退回',resIdle:'填好上面三项，结果显示在这里',
 how:function(b,p,g,r){return g>0?'送的钱按比例扣掉：'+f(b)+' × '+f(p)+' ÷ '+f(p+g):'没有赠送，余额就是能退的钱'},
 note:'只适用于店关门、跑路这类店家的原因。如果是你自己不想用了，通常退得更少。仅供参考，不构成法律意见；店家不退可以打 12315 投诉。',
 foot:'依据最高人民法院法释〔2025〕4号第十五、十八条，核对于 2026-10-30。计算只在你手机上进行，不上传。',more:'更多：打折卡、次卡、年卡、7 天反悔 →',
 eP:'请填实际付了多少',eO:'余额不能比“实付 + 赠送”还多'},
 en:{h1:'Shop closed? Get your card money back',lang:'中文',lead:'A prepaid card is money you top up first, like a gym or salon card in mainland China. If the shop closes, unused money comes back; bonus credit doesn\'t.',
 balL:'Balance left on the card',balS:'as shown',paidL:'What you actually paid',paidS:'your own money',giftL:'Bonus the shop added',giftS:'0 if none',ex:'Example: paid 2,000 + 1,000 bonus',
 resL:'Refund, roughly',resIdle:'Fill in the three boxes to see the result',
 how:function(b,p,g,r){return g>0?'Bonus taken out: '+f(b)+' × '+f(p)+' ÷ '+f(p+g):'No bonus, so the balance is the refund'},
 note:'Only when the shop is at fault (closed, vanished). If you just want out, you usually get less. For reference only, not legal advice.',
 foot:'Based on China\'s Supreme People\'s Court interpretation Fa Shi [2025] No. 4, Art. 15 and 18, checked 2026-10-30. Runs on your device.',more:'More cases (in Chinese) →',
 eP:'Enter what you paid',eO:'The balance can\'t be more than paid + bonus'}};
T.zh.resIdleK=T.zh.resIdle;
var q=new URLSearchParams(location.search).get('lang'),L=q||localStorage.getItem('dlh-lang')||((navigator.language||'').toLowerCase().indexOf('zh')===0?'zh':'en');if(!T[L])L='zh';
function f(x){return Number(x).toLocaleString(L==='zh'?'zh-CN':'en-US',{minimumFractionDigits:0,maximumFractionDigits:2})}
var $=function(i){return document.getElementById(i)};
function paint(){var t=T[L];document.documentElement.lang=L==='zh'?'zh-CN':'en';document.title=t.h1;
 document.querySelectorAll('[data-t]').forEach(function(e){var k=e.getAttribute('data-t');if(typeof t[k]==='string')e.textContent=t[k]});$('lang').textContent=t.lang;calc()}
function idle(msg){$('hero').classList.add('idle');$('big').textContent='—';$('how').textContent=T[L].resIdle;$('err').textContent=msg||''}
function calc(){var t=T[L],bs=$('bal').value,ps=$('paid').value,b=parseFloat(bs),p=parseFloat(ps),g=parseFloat($('gift').value)||0;
 if(bs===''||ps===''){return idle(ps!==''&&!(p>0)?t.eP:'')}
 if(!(p>0))return idle(t.eP);if(b<0||g<0)return idle('');if(b>p+g+1e-9)return idle(t.eO);
 var r=PrepaidCore.refund(b,p,g);$('err').textContent='';$('hero').classList.remove('idle');$('big').textContent='¥'+f(r.refund);$('how').textContent=t.how(b,p,g,r)}
['bal','paid','gift'].forEach(function(i){$(i).addEventListener('input',calc)});
$('ex').addEventListener('click',function(){$('bal').value=2566;$('paid').value=2000;$('gift').value=1000;calc()});
$('lang').addEventListener('click',function(){L=L==='zh'?'en':'zh';localStorage.setItem('dlh-lang',L);paint()});
paint();
})();
</script>
</body>
</html>
