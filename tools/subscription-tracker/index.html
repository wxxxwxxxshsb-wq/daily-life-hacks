<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>订阅清单 · Subscription Tracker</title>
<meta name="description" content="记下每月自动扣费的订阅，看看每月花多少钱。数据只存在你自己的浏览器里，不上传、不注册。">
<meta name="theme-color" content="#F2F4F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F12" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="订阅清单">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--pri:#0D9488;--pri-d:#0F766E;--pri-l:#E6F5F3;--pri-ink:#fff;--bg:#F2F4F5;--card:#fff;--card2:#F1F3F4;--ink:#111827;--ink2:#4B5563;--muted:#8A94A3;--line:rgba(17,24,39,.08);
  --warn:#C2410C;--warn-l:#FFF1E8;--danger:#DC2626;--shadow:0 1px 2px rgba(17,24,39,.04),0 6px 20px rgba(17,24,39,.06);--ease:cubic-bezier(.2,.8,.2,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root{--pri:#2DD4BF;--pri-d:#14B8A6;--pri-l:rgba(45,212,191,.14);--pri-ink:#042F2B;--bg:#0B0F12;--card:#161B20;--card2:#222A31;--ink:#F3F4F6;--ink2:#C2C8D0;--muted:#8B95A1;--line:rgba(255,255,255,.08);--warn:#FB923C;--warn-l:rgba(251,146,60,.15);--danger:#F87171;--shadow:none}}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.shell{position:relative;max-width:430px;min-height:100dvh;margin:0 auto;background:var(--bg);padding:calc(16px + var(--sat)) 16px calc(40px + var(--sab))}
@media (min-width:600px){body{background:#E5E9EC;padding:24px 0}.shell{min-height:calc(100dvh - 48px);border-radius:36px;box-shadow:0 0 0 10px #111,0 30px 80px rgba(0,0,0,.2)}}
@media (min-width:600px) and (prefers-color-scheme: dark){body{background:#05080A}.shell{box-shadow:0 0 0 10px #2A2F35}}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 2px}
h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.02em}
.gear{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink2);box-shadow:var(--shadow)}
.gear svg{width:21px;height:21px}
.lead{margin:4px 2px 16px;color:var(--ink2);font-size:15px}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:24px;padding:20px 20px 18px;background:linear-gradient(140deg,#0F766E,#0D9488 55%,#14B8A6);box-shadow:0 10px 30px rgba(13,148,136,.28)}
@media (prefers-color-scheme: dark){.hero{background:linear-gradient(140deg,#0B4F4A,#0F766E 60%,#0D9488);box-shadow:none}}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero .lbl{font-size:15px;opacity:.9;font-weight:600}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:4px 0 6px;font-variant-numeric:tabular-nums;word-break:break-all;position:relative}
.hero .small{font-size:14px;opacity:.9;position:relative}
.hero .extra{font-size:12.5px;opacity:.8;margin-top:4px;position:relative}
.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;margin:16px 0 8px;border-radius:18px;background:var(--pri);color:var(--pri-ink);font-size:17px;font-weight:700;box-shadow:0 8px 20px rgba(13,148,136,.3);transition:transform .15s var(--ease)}
.add:active,.btn:active{transform:scale(.97)}
.add svg{width:22px;height:22px}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:16px 4px 8px;font-weight:700;font-size:17px}
.sect small{font-weight:500;font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.row{position:relative;display:flex;align-items:center}
.row+.row::before{content:"";position:absolute;left:68px;right:0;top:0;border-top:1px solid var(--line)}
.hit{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:13px 4px 13px 14px;text-align:left}
.av{flex:0 0 42px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;background:var(--pri)}
.mid{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font-size:13px;color:var(--muted)}
.row.soon .when{color:var(--warn);font-weight:700}
.row.soon .av{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--warn)}
.amt{text-align:right;flex:0 0 auto}
.amt b{display:block;font-variant-numeric:tabular-nums}
.amt small{font-size:12px;color:var(--muted)}
.del{flex:0 0 44px;height:44px;margin-right:6px;display:grid;place-items:center;color:var(--muted);border-radius:12px}
.del:active{background:var(--card2)}
.del svg{width:19px;height:19px}
.tip{font-size:12.5px;color:var(--muted);text-align:center;margin:10px 0 0}
.empty{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:22px 18px 20px;margin-top:14px}
.empty h2{font-size:18px;margin:0 0 14px;text-align:center}
.steps{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;align-items:center;gap:12px;font-size:15.5px;font-weight:600}
.steps b{flex:0 0 30px;height:30px;border-radius:50%;background:var(--pri-l);color:var(--pri-d);display:grid;place-items:center;font-size:15px}
@media (prefers-color-scheme: dark){.steps b{color:var(--pri)}}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:15px;font-weight:700;transition:transform .15s var(--ease)}
.btn.soft{background:var(--pri-l);color:var(--pri-d)}
@media (prefers-color-scheme: dark){.btn.soft{color:var(--pri)}}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.danger{background:rgba(220,38,38,.1);color:var(--danger)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.36);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s;z-index:10}
.backdrop.on{opacity:1;visibility:visible;transition:opacity .2s}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:430px;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + var(--sab));transform:translate(-50%,105%);visibility:hidden;transition:transform .24s var(--ease),visibility 0s .24s;z-index:11}
.sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .24s var(--ease)}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(127,127,127,.35);margin:2px auto 10px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.shead b{font-size:17px}
.shead button{color:var(--ink2);font-size:16px;padding:6px 2px;min-width:44px;text-align:left}
.shead span{min-width:44px}
.fl{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin:14px 4px 6px}
.inp{width:100%;height:50px;border-radius:14px;border:1.5px solid transparent;background:var(--card);padding:0 14px;outline:none;-webkit-appearance:none;appearance:none;min-width:0}
.inp:focus{border-color:var(--pri)}
.money{display:flex;align-items:center;background:var(--card);border-radius:14px;border:1.5px solid transparent;padding-left:14px}
.money:focus-within{border-color:var(--pri)}
.money span{font-size:20px;font-weight:700;color:var(--muted);min-width:14px}
.money .inp{border:0;font-size:22px;font-weight:700;background:none;padding-left:8px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:40px;border-radius:10px;font-weight:600;color:var(--ink2);transition:background .18s,color .18s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (prefers-color-scheme: dark){.seg button.on{background:#3A424B}}
.opt{color:var(--muted);font-weight:500;font-size:13px}
details{margin-top:14px}
summary{list-style:none;cursor:pointer;color:var(--pri);font-weight:600;font-size:14px;padding:6px 4px}
summary::-webkit-details-marker{display:none}
summary::after{content:" ▾"}
details[open] summary::after{content:" ▴"}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:10px 4px 4px}
.menu{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 16px;text-align:left;position:relative}
.mi+.mi::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:1px solid var(--line)}
.mi small{display:block;color:var(--muted);font-size:12.5px}
.mi.red{color:var(--danger)}
.mi:active{background:var(--card2)}
.note{font-size:13px;color:var(--muted);margin:14px 4px 0;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translate(-50%,16px);background:rgba(17,24,39,.94);color:#fff;padding:11px 14px 11px 16px;border-radius:14px;font-size:14px;display:flex;gap:16px;align-items:center;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s var(--ease),visibility 0s .2s;z-index:20;width:max-content;max-width:calc(100% - 32px)}
@media (prefers-color-scheme: dark){.toast{background:rgba(55,65,81,.97)}}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .2s,transform .2s var(--ease)}
.toast button{color:#5EEAD4;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{transition-duration:0s!important}}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><h1 data-i18n="title">订阅清单</h1>
    <button class="gear" type="button" id="menuBtn" data-i18n-aria="more" aria-label="更多"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></div>
  <p class="lead" data-i18n="lead">记下每月自动扣费的订阅，看看每月花多少钱</p>

  <div class="hero" id="hero">
    <div class="lbl" data-i18n="monthly">每月合计</div>
    <div class="big" id="total">¥0</div>
    <div class="small" id="yearly"></div>
    <div class="extra" id="extra" hidden></div>
  </div>

  <button class="add" type="button" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="add">添加订阅</span></button>

  <section class="empty" id="empty" hidden>
    <h2 data-i18n="howTo">怎么用？</h2>
    <ol class="steps">
      <li><b>1</b><span data-i18n="s1">点“添加订阅”</span></li>
      <li><b>2</b><span data-i18n="s2">填名称和金额</span></li>
      <li><b>3</b><span data-i18n="s3">看每月合计</span></li>
    </ol>
    <button class="btn soft" type="button" id="sampleBtn" data-i18n="sample">试试示例</button>
  </section>

  <section id="listWrap" hidden>
    <div class="sect"><span data-i18n="mine">我的订阅</span><small id="count"></small></div>
    <ul class="list" id="list"></ul>
    <p class="tip" data-i18n="tip">点一下可修改</p>
  </section>
</div>

<div class="backdrop" id="backdrop"></div>

<form class="sheet" id="sheet" novalidate autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="formTitle">
  <div class="grab"></div>
  <div class="shead"><button type="button" id="cancelBtn" data-i18n="cancel">取消</button><b id="formTitle"></b><span></span></div>
  <input type="hidden" id="fId">
  <label class="fl" for="fName" data-i18n="name">名称</label>
  <input class="inp" id="fName" maxlength="60" data-i18n-ph="namePh">
  <label class="fl" for="fAmount" data-i18n="amount">金额</label>
  <div class="money"><span id="curSym">¥</span><input class="inp" id="fAmount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0"></div>
  <span class="fl" data-i18n="cycle">多久扣一次</span>
  <div class="seg" id="fCycle"><button type="button" data-c="month" data-i18n="month">每月</button><button type="button" data-c="quarter" data-i18n="quarter" hidden>每季度</button><button type="button" data-c="year" data-i18n="year">每年</button></div>
  <label class="fl" for="fNext"><span data-i18n="date">扣费日期</span> <span class="opt" data-i18n="optional">（可不改）</span></label>
  <input class="inp" id="fNext" type="date">
  <details id="moreBox"><summary data-i18n="moreOpts">更多选项</summary>
    <label class="fl" for="fCurrency" data-i18n="currency">币种</label>
    <select class="inp" id="fCurrency"></select>
  </details>
  <div class="err" id="formErr" role="alert"></div>
  <button class="btn pri" type="submit" id="saveBtn" data-i18n="save">保存</button>
  <button class="btn danger" type="button" id="delInSheet" style="margin-top:10px" data-i18n="delete" hidden>删除</button>
</form>

<div class="sheet" id="menu" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="shead"><button type="button" id="menuClose" data-i18n="close">关闭</button><b data-i18n="more">更多</b><span></span></div>
  <span class="fl" data-i18n="language">语言</span>
  <div class="seg" id="langSeg"><button type="button" data-l="zh">中文</button><button type="button" data-l="en">English</button></div>
  <span class="fl" data-i18n="tools">提醒与备份</span>
  <div class="menu">
    <button class="mi" type="button" id="icsBtn"><span><span data-i18n="ics">导出日历提醒</span><small data-i18n="icsHint">扣费前 3 天上午 9 点提醒，用手机日历打开</small></span></button>
    <button class="mi" type="button" id="expBtn"><span><span data-i18n="exp">导出备份</span><small data-i18n="expHint">换手机前先导出</small></span></button>
    <button class="mi" type="button" id="impBtn"><span><span data-i18n="imp">导入备份</span><small data-i18n="impHint">和现有清单合并</small></span></button>
  </div>
  <div class="menu" style="margin-top:14px"><button class="mi red" type="button" id="clearBtn" data-i18n="clear">清空全部</button></div>
  <p class="note" data-i18n="privacy">数据只存在这台设备的浏览器里，不上传、不注册。换手机或清浏览器数据前先导出备份；iPhone 的 Safari 可能清掉长期没打开的网站数据。</p>
  <input type="file" id="impFile" accept=".json,application/json" class="sr" tabindex="-1" aria-hidden="true">
</div>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button type="button" id="toastAct" hidden></button></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
