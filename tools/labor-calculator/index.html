<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>没休的年假能补多少钱 · 年假工资计算器</title>
<meta name="description" content="单位没安排你休年假，每没休 1 天，除了正常工资还要再多给 2 天工资。填月工资和天数，马上算出来。仅供参考，不构成法律意见。">
<meta name="theme-color" content="#F2F4F5">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <div class="top"><h1 data-t="h1"></h1><button class="lang" id="lang" type="button"></button></div>
  <p class="lead" data-t="lead"></p>
  <div class="card">
    <label class="fl" for="wage"><span data-t="wageL"></span> <small data-t="wageS"></small></label>
    <div class="money"><span data-t="cur"></span><input id="wage" type="number" inputmode="decimal" min="0" placeholder="6525"></div>
    <label class="fl" for="days" data-t="daysL"></label>
    <div class="money"><input id="days" type="number" inputmode="decimal" min="0" step="0.5" placeholder="3" style="padding-left:0"><em data-t="dayU"></em></div>
    <div class="err" id="err"></div>
    <button class="ex" id="ex" type="button" data-t="ex"></button>
  </div>
  <section class="hero idle" id="hero" aria-live="polite">
    <div class="lbl" data-t="resL"></div>
    <div class="big" id="big">—</div>
    <div class="small" id="how" data-t="resIdle"></div>
  </section>
  <div class="note" data-t="note"></div>
  <p class="foot"><span data-t="foot"></span> <a href="full.html" data-t="more"></a></p>
</main>
<script src="core.js"></script>
<script>
(function(){
var T={zh:{h1:'没休的年假，能补多少钱？',lang:'English',lead:'单位没安排你休年假（或安排少了），每没休 1 天，除了正常工资，还要再多给你 2 天的工资。填两个数就能算。',
 wageL:'月工资',wageS:'过去 12 个月平均，不算加班费',cur:'¥',daysL:'没休的年假天数',dayU:'天',ex:'填入示例：月薪 6525，没休 3 天',
 resL:'单位还应额外补你',resIdle:'填好上面两项，结果显示在这里',
 how:function(r){return '日工资 '+f(r.daily)+'（月工资 ÷ 21.75）× 2 倍 × 天数'},unit:'元',
 note:'你自己书面申请不休的，单位可以只付正常工资。仅供参考，不构成法律意见；拿不准可以打 12333 问。',
 foot:'依据《企业职工带薪年休假实施办法》第十、十一条，核对于 2026-10-30。计算只在你手机上进行，不上传。',more:'更多：入职离职当年年假、离职补偿 →',
 eW:'请填月工资',eD:'请填没休的天数'},
 en:{h1:'Unused annual leave: what are you owed?',lang:'中文',lead:'For jobs in mainland China. If your employer didn\'t let you take your annual leave, each unused day earns 2 extra days\' pay on top of your normal wage.',
 wageL:'Monthly pay',wageS:'12-month average, no overtime',cur:'¥',daysL:'Unused leave days',dayU:'days',ex:'Try an example: 6,525 a month, 3 days',
 resL:'Extra pay owed to you',resIdle:'Fill in both boxes to see the result',
 how:function(r){return 'Daily pay '+f(r.daily)+' (monthly ÷ 21.75) × 2 × days'},unit:'yuan',
 note:'If you asked in writing not to take the leave, the employer only owes normal pay. For reference only, not legal advice.',
 foot:'Based on China\'s Implementing Measures for Paid Annual Leave, Art. 10–11, checked 2026-10-30. Runs on your device, nothing uploaded.',more:'More calculators (in Chinese) →',
 eW:'Enter your monthly pay',eD:'Enter the unused days'}};
var q=new URLSearchParams(location.search).get('lang'),L=q||localStorage.getItem('dlh-lang')||((navigator.language||'').toLowerCase().indexOf('zh')===0?'zh':'en');if(!T[L])L='zh';
function f(x){return Number(x).toLocaleString(L==='zh'?'zh-CN':'en-US',{minimumFractionDigits:0,maximumFractionDigits:2})}
var $=function(i){return document.getElementById(i)};
function paint(){var t=T[L];document.documentElement.lang=L==='zh'?'zh-CN':'en';document.title=t.h1;
 document.querySelectorAll('[data-t]').forEach(function(e){var k=e.getAttribute('data-t');if(typeof t[k]==='string')e.textContent=t[k]});$('lang').textContent=t.lang;calc()}
function calc(){var t=T[L],w=parseFloat($('wage').value),d=parseFloat($('days').value);$('err').textContent='';
 if(!(w>0)||!(d>0)){$('hero').classList.add('idle');$('big').textContent='—';$('how').textContent=t.resIdle;
  if($('wage').value&&!(w>0))$('err').textContent=t.eW;else if($('days').value&&!(d>0))$('err').textContent=t.eD;return}
 var r=LaborCore.leavePay(w,d);$('hero').classList.remove('idle');$('big').textContent=(L==='zh'?'¥':'¥')+f(r.extra);$('how').textContent=t.how(r)}
$('wage').addEventListener('input',calc);$('days').addEventListener('input',calc);
$('ex').addEventListener('click',function(){$('wage').value=6525;$('days').value=3;calc()});
$('lang').addEventListener('click',function(){L=L==='zh'?'en':'zh';localStorage.setItem('dlh-lang',L);paint()});
paint();
})();
</script>
</body>
</html>
